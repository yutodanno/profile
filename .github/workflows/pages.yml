name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Generate PDF
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          cat > /tmp/profile.md <<'HEADER'
          ---
          pdf_options:
            format: A4
            margin: 18mm 15mm
          launch_options:
            args: ["--no-sandbox", "--disable-setuid-sandbox"]
          css: |-
            body { font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 12px; line-height: 1.65; color: #24292e; }
            table { border-collapse: collapse; width: 100%; margin: 8px 0; break-inside: avoid; }
            tr { break-inside: avoid; }
            th, td { border: 1px solid #d0d7de; padding: 5px 9px; text-align: left; vertical-align: top; }
            th { background: #f6f8fa; }
            h1 { font-size: 21px; }
            h2 { font-size: 17px; border-bottom: 2px solid #159957; padding-bottom: 4px; break-after: avoid; }
            h3 { font-size: 14px; break-after: avoid; }
            hr { border: none; border-top: 1px solid #d0d7de; }
            a { color: #24292e; text-decoration: none; }
            .page-break { break-before: page; }
          ---
          HEADER
          sed -e '/^# /d' -e '/PDF版/d' -e '/職務経歴の詳細はこちら/d' README.md >> /tmp/profile.md
          printf '\n\n' >> /tmp/profile.md
          sed -e '/READMEに戻る/d' CAREER.md >> /tmp/profile.md
          npx --yes md-to-pdf /tmp/profile.md
          sudo cp /tmp/profile.pdf _site/profile.pdf
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
